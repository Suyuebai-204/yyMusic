version: "1.0"
name: sync-to-github
displayName: 自动同步到GitHub
stages:
  - name: sync
    displayName: 同步镜像
    strategy: naturally
    trigger: auto
    steps:
      - step: build@shell
        name: git-sync
        displayName: Git推送至GitHub
        commands:
          - git config --global user.name "Suyuebai"
          - git config --global user.email "3608714354@qq.com"
          - git remote add github https://Suyuebai-204:${GH_TOKEN}@github.com/Suyuebai-204/yyMusic.git
          - git push github HEAD:main --force
