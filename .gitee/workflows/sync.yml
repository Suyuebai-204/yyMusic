name: Sync to GitHub
on: push
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub
        run: |
          git config --global user.name "Suyuebai"
          git config --global user.email "3608714354@qq.com"
          git remote add github https://Suyuebai-204:${{ secrets.GH_TOKEN }}@github.com/Suyuebai-204/yyMusic.git
          git push github HEAD:main --force
