name: Sync Gitee to GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror from Gitee
        uses: wearerequired/git-mirror-action@v1
        with:
          source-repo: https://gitee.com/Suyuebai-204/yyMusic.git
          destination-repo: https://github.com/Suyuebai-204/yyMusic.git
