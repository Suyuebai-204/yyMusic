name: Mirror to GitHub
on:
  push:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repo to GitHub
        uses: wearerequired/git-mirror-action@v1
        with:
          source-repo: "https://gitee.com/suyuebai/yy-music.git"
          destination-repo: "https://${{ secrets.GIT_TOKEN }}@github.com/Suyuebai-204/yyMusic.git"
